<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>depth-worker verify</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 18px 20px; background: #0e0f12; color: #d8dbe0;
         font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
       color: #8b93a1; margin: 0 0 12px; }
  #out { white-space: pre-wrap; }
  .ok { color: #7fd88f; } .bad { color: #ff8a80; } .dim { color: #79808d; }
  canvas { image-rendering: pixelated; margin-top: 12px; border: 1px solid #24272e; }
</style>
</head>
<body>
<h1>depth-worker verify</h1>
<div id="out"></div>
<canvas id="preview" width="259" height="147"></canvas>

<script type="module">
/**
 * Standalone check for apps/demo/depth-worker.js: no video element, no dev-server upload, no
 * conversion UI. It answers the four questions that can only be answered in a real browser —
 * does the pinned transformers.js module import under COEP, does a backend come up, are the map
 * dims what the worker claims, and is the output a float field rather than 256 levels.
 *
 * Query params: ?model=small|base|large &precision=auto|fp16|fp32|q8 &width=518 &frames=3
 * Every line also goes to console.log, so a headless run can be read off stderr.
 */
const q = new URLSearchParams(location.search);
const MODEL = q.get("model") || "small";
const PRECISION = q.get("precision") || "auto";
const WIDTH = Number(q.get("width") || 518);
const FRAMES = Number(q.get("frames") || 3);
const PATCH = 14;
const snap14 = (v) => Math.max(PATCH, Math.round(v / PATCH) * PATCH);

const AUTOCLOSE = q.get("close") === "1"; // headless runs pass it so the browser exits on its own

const out = document.getElementById("out");
function say(line, cls = "") {
  console.log("[depth-verify] " + line);
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = line;
  out.appendChild(div);
}
function finish(ok) {
  document.title = "depth-worker verify · " + (ok ? "DONE" : "FAIL");
  if (AUTOCLOSE) setTimeout(() => window.close(), 200);
}
function die(line) {
  say("FAIL " + line, "bad");
  finish(false);
}

// ---- synthetic frame: a bright near blob over a graded floor, so the depth field has structure
// a gradient alone would not show (a flat ramp survives almost any bug).
const W = snap14(WIDTH);
const H = snap14(W * 9 / 16);
function makeFrame(phase) {
  const px = new Uint8ClampedArray(W * H * 4);
  const cx = W * (0.35 + 0.1 * phase), cy = H * 0.55, r = Math.min(W, H) * 0.28;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const floor = 40 + 180 * (y / H);                        // back-to-front ramp
      const d = Math.hypot(x - cx, y - cy) / r;
      const blob = d < 1 ? 255 * Math.sqrt(1 - d * d) : 0;      // a hemisphere in front of it
      const v = Math.min(255, floor * 0.55 + blob);
      px[i] = v; px[i + 1] = v * 0.92; px[i + 2] = v * 0.8; px[i + 3] = 255;
    }
  }
  return px;
}

// ---- environment ------------------------------------------------------------
say(`page ${location.href}`);
say(`crossOriginIsolated ${self.crossOriginIsolated}`, self.crossOriginIsolated ? "ok" : "bad");
say(`SharedArrayBuffer ${typeof SharedArrayBuffer !== "undefined"}`);
say(`navigator.gpu ${!!navigator.gpu}`);
try {
  // requestAdapter() can hang rather than reject (headless Chrome does exactly that), so it is
  // raced against a deadline here and in the worker.
  const adapter = navigator.gpu
    ? await Promise.race([navigator.gpu.requestAdapter(), new Promise((r) => setTimeout(() => r(null), 3000))])
    : null;
  say(`webgpu adapter ${adapter ? "granted" : "none or timed out"}${adapter?.features?.has?.("shader-f16") ? " · shader-f16" : ""}`,
      adapter ? "ok" : "dim");
} catch (e) { say(`webgpu adapter error ${e?.message || e}`, "dim"); }
say(`request model=${MODEL} precision=${PRECISION} frame=${W}x${H} frames=${FRAMES}`);

// ---- worker -----------------------------------------------------------------
let worker;
try {
  worker = new Worker(new URL("../depth-worker.js", import.meta.url), { type: "module" });
} catch (e) { die(`worker construction: ${e?.message || e}`); throw e; }

const watchdog = setTimeout(() => die("timeout: no result after 180 s"), 180000);
let sent = 0, got = 0, msSum = 0, t0 = 0;
let lastPct = -1;

worker.onerror = (e) => { clearTimeout(watchdog); die(`worker error: ${e?.message || e}`); };
worker.onmessage = (ev) => {
  const m = ev.data;
  if (!m) return;

  if (m.type === "progress") {
    const pct = Math.round(m.progress || 0);
    if (m.status === "progress_total" && pct !== lastPct) { lastPct = pct; say(`model download ${pct}%`, "dim"); }
    return;
  }

  if (m.type === "ready") {
    say(`ready device=${m.device} dtype=${m.dtype} model=${m.model}`, "ok");
    t0 = performance.now();
    worker.postMessage({ type: "frame", index: sent, data: makeFrame(sent).buffer, width: W, height: H });
    sent++;
    return;
  }

  if (m.type === "depth") {
    const d = new Float32Array(m.data);
    let min = Infinity, max = -Infinity, sum = 0;
    for (let i = 0; i < d.length; i++) { const v = d[i]; if (v < min) min = v; if (v > max) max = v; sum += v; }
    const mean = sum / d.length;
    const distinct = new Set();
    for (let i = 0; i < d.length && distinct.size <= 300; i += 7) distinct.add(d[i]);
    msSum += m.ms || 0; got++;
    say(`frame ${m.index} · map ${m.width}x${m.height} (${d.length} floats) · ` +
        `min ${min.toFixed(4)} mean ${mean.toFixed(4)} max ${max.toFixed(4)} · ` +
        `${(m.ms || 0).toFixed(1)} ms onnx · ${(m.prepMs || 0).toFixed(1)} ms prep · ` +
        `${distinct.size > 300 ? ">300" : distinct.size} distinct values sampled`);
    if (m.index === 0) draw(d, m.width, m.height, min, max);

    if (sent < FRAMES) {
      worker.postMessage({ type: "frame", index: sent, data: makeFrame(sent).buffer, width: W, height: H });
      sent++;
      return;
    }
    if (got === FRAMES) {
      clearTimeout(watchdog);
      const wall = (performance.now() - t0) / got;
      say(`DONE ${got} frames · ${(msSum / got).toFixed(1)} ms/f onnx · ${wall.toFixed(1)} ms/f wall`, "ok");
      worker.terminate();
      finish(true);
    }
    return;
  }

  if (m.type === "error") { clearTimeout(watchdog); die(`worker reported: ${m.message}`); }
};

function draw(d, w, h, min, max) {
  const c = document.getElementById("preview");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(w, h);
  const span = max - min || 1;
  for (let i = 0; i < d.length; i++) {
    const v = ((d[i] - min) / span) * 255;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

worker.postMessage({ type: "init", modelKey: MODEL, precision: PRECISION, inferWidth: W });
say("init sent · waiting for the model", "dim");
</script>
</body>
</html>
